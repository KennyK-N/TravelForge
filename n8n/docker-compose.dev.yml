version: "3.8"

services:
  postgres-n8n:
    image: postgres:15
    container_name: postgres-n8n
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
    networks:
      - app-network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres-n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: mydb_dev
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: password

      N8N_ENCRYPTION_KEY: "your-key"

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - app-network

volumes:
  postgres_n8n_data:
  n8n_data:

networks:
  app-network:
    external: true
